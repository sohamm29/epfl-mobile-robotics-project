[project]
name = "epfl-mobile-robotics-project"
version = "0.2.1"
description = "EPFL Mobile Robotics Project"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies for your application go here.
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pyserial>=3.5",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tdmclient>=0.1.21",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.209",
]

[dependency-groups]
# Development and tooling dependencies. Not installed in production.
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.12.3",
    "ipywidgets>=8.1.9",
    "jupyter-contrib-nbextensions>=0.7.0",
    "matplotlib>=3.11.2",
    "loguru>=0.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
